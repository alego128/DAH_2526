<ion-card 
  *ngIf="receta"
  (click)="abrirDetalle()"
  [class.facil]="receta.dificultad === 'Fácil'"
  [class.media]="receta.dificultad === 'Media'"
  [class.dificil]="receta.dificultad === 'Difícil'">

  <!-- Imagen opcional -->
  <img *ngIf="receta.imagen" [src]="receta.imagen" [alt]="receta.nombre" class="receta-imagen" />

  <ion-card-header>
    <ion-card-title>
      <ion-input
        [(ngModel)]="receta.nombre"
        placeholder="Nombre de la receta">
      </ion-input>
    </ion-card-title>
    <ion-card-subtitle>
      <ion-input
        [(ngModel)]="receta.categoria"
        placeholder="Categoría">
      </ion-input>
      - 
      <ion-select [(ngModel)]="receta.dificultad" interface="popover">
        <ion-select-option value="Fácil">Fácil</ion-select-option>
        <ion-select-option value="Media">Media</ion-select-option>
        <ion-select-option value="Difícil">Difícil</ion-select-option>
      </ion-select>
    </ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <ion-textarea
      [(ngModel)]="receta.descripcion"
      placeholder="Descripción de la receta">
    </ion-textarea>

    <p>
      <strong>Tiempo de preparación:</strong> 
      <ion-input type="number" [(ngModel)]="receta.tiempoPreparacion"></ion-input> min
    </p>

    <p *ngIf="receta.ingredientes?.length">
      <strong>Ingredientes:</strong> {{ receta.ingredientes.join(', ') }}
    </p>

    <!-- Botones de acción -->
    <ion-button expand="block" color="primary" (click)="guardarClick()">
      Guardar cambios
    </ion-button>

    <ion-button expand="block" color="danger" (click)="borrarClick($event)">
      Eliminar
    </ion-button>
  </ion-card-content>
</ion-card>
