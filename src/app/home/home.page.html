<app-header></app-header>
<ion-content>

  <!-- BOTÓN FLOTANTE -->
  <ion-fab vertical="bottom" horizontal="start" slot="fixed" style="z-index: 100;">
    <ion-fab-button class="fab-receta" (click)="toggleFormulario()">
      {{ mostrarFormulario ? 'x' : '+' }}
    </ion-fab-button>
  </ion-fab>

  <!-- FORMULARIO -->
  <div *ngIf="mostrarFormulario" style="z-index: 50; position: relative;">
    <ion-list>
      <ion-item>
        <ion-input
          label="Nombre de la receta"
          label-placement="floating"
          placeholder="Ej: Tarta de manzana"
          [(ngModel)]="nuevaReceta.nombre">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="URL de imagen"
          label-placement="floating"
          placeholder="assets/mi-imagen.jpg"
          [(ngModel)]="nuevaReceta.imagen">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="number"
          label="Tiempo de preparación (min)"
          label-placement="floating"
          [(ngModel)]="nuevaReceta.tiempoPreparacion">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Categoría"
          label-placement="floating"
          placeholder="Ej: Italiana, Postre..."
          [(ngModel)]="nuevaReceta.categoria">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-select
          label="Dificultad"
          label-placement="floating"
          interface="popover"
          [(ngModel)]="nuevaReceta.dificultad">
          <ion-select-option value="Fácil">Fácil</ion-select-option>
          <ion-select-option value="Media">Media</ion-select-option>
          <ion-select-option value="Difícil">Difícil</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Descripción"
          label-placement="floating"
          placeholder="Describe brevemente la receta"
          [(ngModel)]="nuevaReceta.descripcion">
        </ion-textarea>
      </ion-item>
    </ion-list>

    <ion-button expand="block" class="boton-receta ion-margin" (click)="agregarReceta()">
      Añadir Receta
    </ion-button>
  </div>

  <!-- SKELETONS -->
  <div *ngIf="cargando">
    <div class="recetas-grid">
      <ion-card *ngFor="let s of skeletons" class="receta-skeleton">
        <!-- Imagen skeleton -->
        <div class="img-skeleton">
          <ion-skeleton-text animated style="width: 100%; height: 100%;"></ion-skeleton-text>
        </div>

        <!-- Texto skeleton -->
        <ion-card-content>
          <ion-skeleton-text animated style="width: 60%; height: 20px; margin-top: 10px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 90%; height: 14px; margin-top: 6px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 70%; height: 14px; margin-top: 6px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 40%; height: 14px; margin-top: 6px;"></ion-skeleton-text>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <!-- CONTENIDO REAL -->
  <div *ngIf="!cargando">
    <div class="recetas-grid">
      <app-receta-item 
        *ngFor="let receta of recetas" 
        [receta]="receta">
      </app-receta-item>
    </div>
  </div>

</ion-content>
