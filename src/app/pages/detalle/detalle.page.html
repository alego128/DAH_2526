<ion-header>
  <ion-toolbar>
    <ion-title>{{ receta?.nombre }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="receta">

  <!-- Contenedor para centrar el card -->
  <div class="detalle-wrapper">

    <ion-card class="detalle-card">
      
      <!-- Imagen principal -->
      <img [src]="receta.imagen" [alt]="receta.nombre" class="receta-imagen" />

      <ion-card-header>
        <ion-card-title>{{ receta.nombre }}</ion-card-title>
        <ion-card-subtitle>
          {{ receta.categoria }} • {{ receta.dificultad }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <p class="desc">{{ receta.descripcion }}</p>

        <p class="tiempo">
          <strong>⏱ Tiempo:</strong> {{ receta.tiempoPreparacion }} min
        </p>

        <div class="ingredientes">
          <strong>🛒 Ingredientes:</strong>
          <ul>
            <li *ngFor="let ing of receta.ingredientes">
              {{ ing }}
            </li>
          </ul>
        </div>

      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
